name: Goal 1 foundation

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra openstack

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify backend and contract
        run: |
          uv run ruff check backend
          uv run mypy backend/vantage_bff
          uv run pytest -q
          uv run openapi-spec-validator api/openapi.yaml
          uv run openapi-spec-validator api/openapi.goal1-mvp.yaml
