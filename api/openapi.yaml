      summary: List project-visible security groups
      operationId: listSecurityGroups
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      - name: name
        in: query
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: A bounded cursor-backed security-group page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /instances/{instance_id}:
    get:
      tags:
      - Instances
      summary: Get one instance in the active project
      operationId: getInstance
      parameters:
      - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: Project-scoped instance detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /volumes:
    get:
      tags:
      - storage
      summary: Volumes
      operationId: volumes_api_v1_volumes_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
          title: Limit
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Name
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Status
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StorageSort'
          default: created_at
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Direction
      - name: vantage_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vantage Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoragePage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - storage
      summary: Create Volume
      operationId: create_volume_api_v1_volumes_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: vantage_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vantage Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /volumes/{volume_id}:
    get:
      tags:
      - storage
      summary: Volume
      operationId: volume_api_v1_volumes__volume_id__get
      parameters:
      - name: volume_id
        in: path
        required: true
        schema:
          type: string
          title: Volume Id
      - name: vantage_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vantage Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Volume Api V1 Volumes  Volume Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - storage
      summary: Update Volume
      operationId: update_volume_api_v1_volumes__volume_id__patch
      parameters:
      - name: volume_id
        in: path
        required: true
        schema:
          type: string
          title: Volume Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: vantage_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vantage Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumePatch'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - storage
      summary: Delete Volume
      operationId: delete_volume_api_v1_volumes__volume_id__delete
      parameters:
      - name: volume_id
        in: path
        required: true
        schema:
          type: string
          title: Volume Id
      - name: confirmation
        in: query
        required: true
        schema:
          type: string
          title: Confirmation
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: vantage_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Vantage Session
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /volumes/{volume_id}/actions:
