      responses:
        '200':
          description: A bounded cursor-backed keypair page without private material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPairPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /networks:
    get:
      tags:
      - Provisioning Inputs
      summary: List project-visible networks
      operationId: listNetworks
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      - name: name
        in: query
        schema:
          type: string
          maxLength: 255
      - name: status
        in: query
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: A bounded cursor-backed network page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /security-groups:
    get:
      tags:
