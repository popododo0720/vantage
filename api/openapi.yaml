components:
  headers:
    CsrfToken:
      description: Session-bound CSRF token retained only in browser memory.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vantage_session
      description: Opaque session identifier; never an OpenStack token.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Bound to the current Vantage server session.
      schema:
        type: string
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when a live Vantage session exists.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Discrete server-side page size selected by the user.
      schema:
        type: integer
        enum:
        - 10
        - 25
        - 50
        - 100
        default: 25
    PageNumber:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: The Vantage session is missing or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The request failed CSRF or OpenStack policy enforcement.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource is unavailable in the active scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The active scope or requested progressive cursor page is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests at the Vantage or identity boundary.
      headers:
        Retry-After:
          description: Seconds before retry when provided by the boundary.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: An OpenStack service is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: An OpenStack service did not respond within the bounded deadline.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Request schema or query validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      - domain
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          writeOnly: true
        domain:
          type: string
          minLength: 1
          maxLength: 255
    SessionPreferenceRequest:
      type: object
      additionalProperties: false
      required:
      - locale
      properties:
        locale:
          type: string
          enum:
          - en
          - ko
    Session:
      type: object
      additionalProperties: false
      required:
      - user
      - active_scope
      - expires_at
      - regions
      - locale
      properties:
        user:
          $ref: '#/components/schemas/User'
        active_scope:
          anyOf:
          - $ref: '#/components/schemas/Scope'
          - type: 'null'
        expires_at:
          type: string
          format: date-time
        regions:
          type: array
          items:
            type: string
        locale:
          type: string
          enum:
          - en
          - ko
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - domain_id
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
          - type: string
          - type: 'null'
    Project:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - domain_id
      - enabled
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
          - type: string
          - type: 'null'
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
    ScopeRequest:
      type: object
      additionalProperties: false
      required:
      - project_id
      - region
      properties:
        project_id:
          type: string
        region:
          type: string
    Scope:
      type: object
      additionalProperties: false
      required:
      - project
      - region
      properties:
