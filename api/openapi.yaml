openapi: 3.1.0
info:
  title: Vantage BFF API
  version: 0.1.0
  summary: Implemented Goal 1.1 session and project-scope API
  description: |
    Browser-facing API implemented by the current Vantage runtime. The browser
    never receives an OpenStack token or calls an OpenStack service endpoint
    directly. The later Goal 1 MVP contract is maintained separately in
    `openapi.goal1-mvp.yaml` and is not an implemented runtime contract.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
    description: Browser session lifecycle backed by Keystone authentication.
  - name: Projects
    description: Accessible projects and the active project scope.
paths:
  /session:
    get:
      tags: [Session]
      summary: Get the current Vantage session
      operationId: getSession
      responses:
        "200":
          description: Authenticated session
          headers:
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [Session]
      summary: Update browser-facing session preferences
      operationId: updateSessionPreferences
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPreferenceRequest"
      responses:
        "200":
          description: Updated session preferences
          headers:
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"
    delete:
      tags: [Session]
      summary: Sign out and invalidate the server session
      description: |
        Idempotent when the session is absent or expired. A live session
        requires its session-bound CSRF token.
      operationId: deleteSession
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      responses:
        "204":
          description: Session deleted or already absent
        "403":
          $ref: "#/components/responses/Forbidden"
  /session/login:
    post:
      tags: [Session]
      summary: Authenticate with Keystone through Vantage
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque HttpOnly, Secure, SameSite session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /projects:
    get:
      tags: [Projects]
      summary: List projects accessible to the signed-in user
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Server-filtered project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /scope:
    put:
      tags: [Projects]
      summary: Set the active project and region
      operationId: setScope
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeRequest"
      responses:
        "200":
          description: Rotated project-scoped session context
          headers:
            Set-Cookie:
              description: Rotated opaque session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "422":
          $ref: "#/components/responses/InvalidRequest"
components:
  headers:
    CsrfToken:
      description: Session-bound CSRF token retained only in browser memory.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vantage_session
      description: Opaque session identifier; never an OpenStack token.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Bound to the current Vantage server session.
      schema:
        type: string
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when a live Vantage session exists.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Discrete server-side page size selected by the user.
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 25
    PageNumber:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    Unauthenticated:
      description: The Vantage session is missing or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The request failed CSRF or OpenStack policy enforcement.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested project scope is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The requested scope could not be established.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many requests at the Vantage or identity boundary.
      headers:
        Retry-After:
          description: Seconds before retry when provided by the boundary.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The identity service is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: Request schema or query validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, domain]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          writeOnly: true
        domain:
          type: string
          minLength: 1
          maxLength: 255
    SessionPreferenceRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale:
          type: string
          enum: [en, ko]
    Session:
      type: object
      additionalProperties: false
      required: [user, active_scope, expires_at, regions, locale]
      properties:
        user:
          $ref: "#/components/schemas/User"
        active_scope:
          anyOf:
            - $ref: "#/components/schemas/Scope"
            - type: "null"
        expires_at:
          type: string
          format: date-time
        regions:
          type: array
          items:
            type: string
        locale:
          type: string
          enum: [en, ko]
    User:
      type: object
      additionalProperties: false
      required: [id, name, domain_id]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
            - type: string
            - type: "null"
    Project:
      type: object
      additionalProperties: false
      required: [id, name, domain_id, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
            - type: string
            - type: "null"
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
    ScopeRequest:
      type: object
      additionalProperties: false
      required: [project_id, region]
      properties:
        project_id:
          type: string
        region:
          type: string
    Scope:
      type: object
      additionalProperties: false
      required: [project, region]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        region:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - number
        - size
        - item_from
        - item_to
        - total_items
        - total_pages
        - has_previous
        - has_next
        - navigable_pages
        - openstack_request_id
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
          enum: [10, 25, 50, 100]
        item_from:
          type: integer
          minimum: 0
        item_to:
          type: integer
          minimum: 0
        total_items:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        total_pages:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        has_previous:
          type: boolean
        has_next:
          type: boolean
        navigable_pages:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
        openstack_request_id:
          anyOf:
            - type: string
            - type: "null"
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        trace_id:
          type: string
        openstack_request_id:
          type: string
