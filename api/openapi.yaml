openapi: 3.1.0
info:
  title: Vantage BFF API
  version: 0.1.0
  summary: Goal 1 contract for the initial usable project MVP
  description: |
    Browser-facing API for Vantage Goal 1: secure project entry, quota-first
    overview, daily instance lifecycle, connectivity, volume attachment, and
    noVNC. The browser never receives an OpenStack token or calls an OpenStack
    service endpoint directly.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
    description: Browser session lifecycle backed by Keystone authentication.
  - name: Projects
    description: Accessible projects and the active project scope.
  - name: Overview
    description: Quota-first, partially resilient project summary.
  - name: Quotas
    description: Detailed finite quota set for the active project and region.
  - name: Instances
    description: Project instance inventory, provisioning, and lifecycle.
  - name: Operations
    description: Asynchronous command state and upstream request correlation.
  - name: Images
    description: Server-filtered Glance image inventory.
  - name: Flavors
    description: Server-filtered Nova Flavor inventory.
  - name: KeyPairs
    description: Project keypair inventory and one-time key generation.
  - name: Networks
    description: Goal 1 Neutron networks, ports, and interface attachments.
  - name: SecurityGroups
    description: Project security groups available to provisioning and ports.
  - name: FloatingIPs
    description: Project Floating-IP allocation and association.
  - name: Volumes
    description: Project Cinder volumes and instance attachments.
paths:
  /session:
    get:
      tags: [Session]
      summary: Get the current Vantage session
      operationId: getSession
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [Session]
      summary: Update browser-facing session preferences
      operationId: updateSessionPreferences
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPreferenceRequest"
      responses:
        "200":
          description: Updated session preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [Session]
      summary: Sign out and invalidate the server session
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session deleted
  /session/login:
    post:
      tags: [Session]
      summary: Authenticate with Keystone through Vantage
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque HttpOnly, Secure, SameSite session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /projects:
    get:
      tags: [Projects]
      summary: List projects accessible to the signed-in user
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /scope:
    put:
      tags: [Projects]
      summary: Set the active project and region
      operationId: setScope
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeRequest"
      responses:
        "200":
          description: New project-scoped session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Scope could not be established
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /overview:
    get:
      tags: [Overview]
      summary: Get the active project's quota-first overview
      operationId: getProjectOverview
      responses:
        "200":
          description: Overview with independent widget results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quotas:
    get:
      tags: [Quotas]
      summary: Get detailed quotas for the active project
      operationId: getProjectQuotas
      parameters:
        - name: service
          in: query
          schema:
            type: string
            enum: [compute, network, storage]
      responses:
        "200":
          description: Detailed quotas with independent service failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /instances:
    get:
      tags: [Instances]
      summary: List instances in the active project
      operationId: listInstances
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          schema:
            type: string
        - name: image_id
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, name, status]
            default: created_at
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated project instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Instances]
      summary: Create one or more instances in the active project
      operationId: createInstances
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}:
    get:
      tags: [Instances]
      summary: Get one instance in the active project
      operationId: getInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Instance detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Instances]
      summary: Update permitted instance properties
      operationId: updateInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Instances]
      summary: Delete an instance with explicit dependent-resource behavior
      operationId: deleteInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: delete_attached_volumes
          in: query
          schema:
            type: boolean
            default: false
        - name: release_floating_ips
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/actions:
    post:
      tags: [Instances]
      summary: Run a state-aware instance lifecycle action
      operationId: runInstanceAction
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceActionRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/resize:
    post:
      tags: [Instances]
      summary: Start an asynchronous resize
      operationId: resizeInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResizeInstanceRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/resize/confirm:
    post:
      tags: [Instances]
      summary: Confirm a server in VERIFY_RESIZE
      operationId: confirmInstanceResize
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/resize/revert:
    post:
      tags: [Instances]
      summary: Revert a server in VERIFY_RESIZE
      operationId: revertInstanceResize
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/console:
    post:
      tags: [Instances]
      summary: Create a short-lived remote console session
      operationId: createInstanceConsole
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsoleRequest"
      responses:
        "201":
          description: Short-lived console URL; never persist or log it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          description: Requested console type is unsupported by this cloud
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /operations/{operation_id}:
    get:
      tags: [Operations]
      summary: Get asynchronous operation state
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Current operation state and request correlation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /images:
    get:
      tags: [Images]
      summary: List images available to the active project
      operationId: listImages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
        - name: visibility
          in: query
          schema:
            type: string
            enum: [private, shared, community, public]
      responses:
        "200":
          description: Paginated Glance images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /flavors:
    get:
      tags: [Flavors]
      summary: List Flavors available to the active project
      operationId: listFlavors
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Paginated allowed Flavors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlavorPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /keypairs:
    get:
      tags: [KeyPairs]
      summary: List keypairs in the active project
      operationId: listKeyPairs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Paginated keypairs without private material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPairPage"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [KeyPairs]
      summary: Generate or import a keypair
      operationId: createKeyPair
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyPairRequest"
      responses:
        "201":
          description: Created keypair; generated private material appears once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKeyPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /keypairs/{keypair_name}:
    delete:
      tags: [KeyPairs]
      summary: Delete a project keypair
      operationId: deleteKeyPair
      parameters:
        - name: keypair_name
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Keypair deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /networks:
    get:
      tags: [Networks]
      summary: List project-visible Neutron networks
      operationId: listNetworks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated Neutron networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /security-groups:
    get:
      tags: [SecurityGroups]
      summary: List project-visible security groups
      operationId: listSecurityGroups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated Neutron security groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGroupPage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /instances/{instance_id}/interfaces:
    get:
      tags: [Networks]
      summary: List attached instance interfaces
      operationId: listInstanceInterfaces
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Attached Nova interfaces backed by Neutron ports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterfacePage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Networks]
      summary: Attach a network or compatible existing port
      operationId: attachInstanceInterface
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachInterfaceRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/interfaces/{port_id}:
    delete:
      tags: [Networks]
      summary: Detach an instance interface
      operationId: detachInstanceInterface
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/PortId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /ports/{port_id}:
    patch:
      tags: [Networks]
      summary: Update supported Neutron port properties
      operationId: updatePort
      parameters:
        - $ref: "#/components/parameters/PortId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /floating-ips:
    get:
      tags: [FloatingIPs]
      summary: List Floating IPs in the active project
      operationId: listFloatingIPs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            type: string
        - name: port_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated Neutron Floating IPs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingIPPage"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [FloatingIPs]
      summary: Allocate a Floating IP with optional association
      operationId: createFloatingIP
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFloatingIPRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /floating-ips/{floating_ip_id}:
    patch:
      tags: [FloatingIPs]
      summary: Associate or disassociate a Floating IP
      operationId: updateFloatingIP
      parameters:
        - $ref: "#/components/parameters/FloatingIPId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFloatingIPRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [FloatingIPs]
      summary: Release an unneeded Floating IP allocation
      operationId: deleteFloatingIP
      parameters:
        - $ref: "#/components/parameters/FloatingIPId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /volumes:
    get:
      tags: [Volumes]
      summary: List volumes in the active project
      operationId: listVolumes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: name
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: attachment
          in: query
          schema:
            type: string
            enum: [all, attached, available]
            default: all
      responses:
        "200":
          description: Paginated Cinder volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumePage"
        "403":
          $ref: "#/components/responses/Forbidden"
  /instances/{instance_id}/volume-attachments:
    get:
      tags: [Volumes]
      summary: List an instance's volume attachments
      operationId: listInstanceVolumeAttachments
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Current Cinder/Nova attachment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeAttachmentPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Volumes]
      summary: Attach a project volume to an instance
      operationId: attachInstanceVolume
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachVolumeRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /instances/{instance_id}/volume-attachments/{volume_id}:
    delete:
      tags: [Volumes]
      summary: Detach a volume without deleting it
      operationId: detachInstanceVolume
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/VolumeId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vantage_session
      description: Opaque session identifier; never an OpenStack token.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Bound to the current Vantage server session.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical mutation within the active scope.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: Discrete server-side page size selected by the user.
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PortId:
      name: port_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FloatingIPId:
      name: floating_ip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VolumeId:
      name: volume_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AcceptedOperation:
      description: Command accepted for asynchronous processing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Operation"
    BadRequest:
      description: Request validation or unsupported capability failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: The Vantage session is missing or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: OpenStack policy denied the active user's request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found in the active scope
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many authentication attempts
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Resource state, revision, or duplicate-operation conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, domain]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          writeOnly: true
        domain:
          type: string
          minLength: 1
          maxLength: 255
    Session:
      type: object
      additionalProperties: false
      required: [user, expires_at, projects, regions, locale]
      properties:
        user:
          $ref: "#/components/schemas/User"
        active_scope:
          anyOf:
            - $ref: "#/components/schemas/Scope"
            - type: "null"
        expires_at:
          type: string
          format: date-time
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        regions:
          type: array
          items:
            type: string
        locale:
          type: string
          enum: [en, ko]
    SessionPreferenceRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale:
          type: string
          enum: [en, ko]
    User:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          type: string
    Project:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          type: string
        enabled:
          type: boolean
    ScopeRequest:
      type: object
      additionalProperties: false
      required: [project_id, region]
      properties:
        project_id:
          type: string
        region:
          type: string
    Scope:
      type: object
      additionalProperties: false
      required: [project, region]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        region:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"
    Quota:
      type: object
      additionalProperties: false
      required: [service, resource, used, reserved]
      properties:
        service:
          type: string
          enum: [compute, network, storage]
        resource:
          type: string
          enum:
            - instances
            - cores
            - ram_mib
            - volumes
            - gigabytes
            - snapshots
            - backups
            - backup_gigabytes
            - floating_ips
        used:
          type: number
          minimum: 0
        reserved:
          type: number
          minimum: 0
        limit:
          anyOf:
            - type: number
            - type: "null"
        unit:
          type: string
          enum: [count, MiB, GiB]
        state:
          type: string
          enum: [normal, watch, high, unknown]
    QuotaCollection:
      type: object
      additionalProperties: false
      required: [scope, generated_at, quotas, partial_errors]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        generated_at:
          type: string
          format: date-time
        stale:
          type: boolean
          default: false
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/Quota"
        partial_errors:
          type: array
          items:
            $ref: "#/components/schemas/WidgetError"
    WidgetError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        openstack_request_id:
          type: string
    ProjectOverview:
      type: object
      additionalProperties: false
      required: [scope, generated_at, quotas, instance_summary, partial_errors]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        generated_at:
          type: string
          format: date-time
        stale:
          type: boolean
          default: false
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/Quota"
        instance_summary:
          $ref: "#/components/schemas/InstanceSummary"
        partial_errors:
          type: array
          items:
            $ref: "#/components/schemas/WidgetError"
    InstanceSummary:
      type: object
      additionalProperties: false
      required: [total, active, stopped, error]
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        stopped:
          type: integer
          minimum: 0
        error:
          type: integer
          minimum: 0
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        flavor:
          type: string
        image:
          type: string
        addresses:
          type: array
          items:
            type: string
    InstancePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        page:
          $ref: "#/components/schemas/PageInfo"
    InstanceDetail:
      allOf:
        - $ref: "#/components/schemas/Instance"
        - type: object
          properties:
            volumes:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                  device:
                    type: string
            openstack_request_id:
              type: string
    NetworkAttachmentRequest:
      type: object
      additionalProperties: false
      description: Exactly one of network_id or port_id is required.
      oneOf:
        - required: [network_id]
          not:
            required: [port_id]
        - required: [port_id]
          not:
            anyOf:
              - required: [network_id]
              - required: [fixed_ip]
      properties:
        network_id:
          type: string
          format: uuid
        port_id:
          type: string
          format: uuid
        fixed_ip:
          type: string
    ExternalAccessRequest:
      type: object
      additionalProperties: false
      required: [mode]
      oneOf:
        - properties:
            mode:
              const: none
          not:
            required: [floating_ip_id]
        - properties:
            mode:
              const: allocate
          not:
            required: [floating_ip_id]
        - required: [floating_ip_id]
          properties:
            mode:
              const: associate_existing
            floating_ip_id:
              type: string
              format: uuid
      properties:
        mode:
          type: string
          enum: [none, allocate, associate_existing]
        floating_ip_id:
          type: string
          format: uuid
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      required: [name, image_id, flavor_id, networks]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        count:
          type: integer
          minimum: 1
          default: 1
        image_id:
          type: string
          format: uuid
        flavor_id:
          type: string
        availability_zone:
          anyOf:
            - type: string
            - type: "null"
        networks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NetworkAttachmentRequest"
        security_group_ids:
          type: array
          items:
            type: string
            format: uuid
        keypair_name:
          anyOf:
            - type: string
            - type: "null"
        external_access:
          $ref: "#/components/schemas/ExternalAccessRequest"
    UpdateInstanceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    InstanceActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum:
            - start
            - stop
            - soft_reboot
            - hard_reboot
            - pause
            - unpause
            - suspend
            - resume
            - shelve
            - unshelve
    ResizeInstanceRequest:
      type: object
      additionalProperties: false
      required: [flavor_id]
      properties:
        flavor_id:
          type: string
    ConsoleRequest:
      type: object
      additionalProperties: false
      properties:
        protocol:
          type: string
          const: vnc
          default: vnc
        type:
          type: string
          const: novnc
          default: novnc
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [instance_id, type, url, expires_at]
      properties:
        instance_id:
          type: string
          format: uuid
        type:
          type: string
          const: novnc
        url:
          type: string
          format: uri
          description: Sensitive short-lived URL; never log or persist.
        expires_at:
          type: string
          format: date-time
        openstack_request_id:
          type: string
    OperationTarget:
      type: object
      additionalProperties: false
      required: [resource_type]
      properties:
        resource_type:
          type: string
        resource_id:
          anyOf:
            - type: string
            - type: "null"
        resource_name:
          anyOf:
            - type: string
            - type: "null"
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, submitted_at, target]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed, cancelled]
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        target:
          $ref: "#/components/schemas/OperationTarget"
        trace_id:
          type: string
        openstack_request_ids:
          type: array
          items:
            type: string
        problem:
          anyOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
    FixedIPRequest:
      type: object
      additionalProperties: false
      properties:
        subnet_id:
          type: string
          format: uuid
        ip_address:
          type: string
    AttachInterfaceRequest:
      type: object
      additionalProperties: false
      description: Exactly one of network_id or port_id is required.
      oneOf:
        - required: [network_id]
          not:
            required: [port_id]
        - required: [port_id]
          not:
            anyOf:
              - required: [network_id]
              - required: [fixed_ips]
      properties:
        network_id:
          type: string
          format: uuid
        port_id:
          type: string
          format: uuid
        fixed_ips:
          type: array
          items:
            $ref: "#/components/schemas/FixedIPRequest"
    UpdatePortRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        mac_address:
          type: string
          description: Capability and resource-state gated.
        fixed_ips:
          type: array
          items:
            $ref: "#/components/schemas/FixedIPRequest"
        security_group_ids:
          type: array
          items:
            type: string
            format: uuid
        qos_policy_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        revision_number:
          type: integer
          minimum: 0
          description: Required by the BFF when revision-aware updates are available.
    CreateFloatingIPRequest:
      type: object
      additionalProperties: false
      required: [floating_network_id]
      properties:
        floating_network_id:
          type: string
          format: uuid
        subnet_id:
          type: string
          format: uuid
        port_id:
          type: string
          format: uuid
        fixed_ip_address:
          type: string
        description:
          type: string
          maxLength: 255
    UpdateFloatingIPRequest:
      type: object
      additionalProperties: false
      required: [port_id]
      properties:
        port_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        fixed_ip_address:
          anyOf:
            - type: string
            - type: "null"
        revision_number:
          type: integer
          minimum: 0
    AttachVolumeRequest:
      type: object
      additionalProperties: false
      required: [volume_id]
      properties:
        volume_id:
          type: string
          format: uuid
        device:
          type: string
          description: Optional requested device; the cloud may choose the final device.
    Image:
      type: object
      additionalProperties: false
      required: [id, name, status, visibility]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        visibility:
          type: string
          enum: [private, shared, community, public]
        disk_format:
          type: string
        container_format:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        min_disk_gib:
          type: integer
          minimum: 0
        min_ram_mib:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    ImagePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        page:
          $ref: "#/components/schemas/PageInfo"
    Flavor:
      type: object
      additionalProperties: false
      required: [id, name, vcpus, ram_mib, disk_gib]
      properties:
        id:
          type: string
        name:
          type: string
        vcpus:
          type: integer
          minimum: 1
        ram_mib:
          type: integer
          minimum: 1
        disk_gib:
          type: integer
          minimum: 0
        ephemeral_gib:
          type: integer
          minimum: 0
        is_public:
          type: boolean
    FlavorPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Flavor"
        page:
          $ref: "#/components/schemas/PageInfo"
    KeyPair:
      type: object
      additionalProperties: false
      required: [name, type, fingerprint]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [ssh, x509]
        fingerprint:
          type: string
        public_key_preview:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    KeyPairPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KeyPair"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateKeyPairRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [ssh, x509]
          default: ssh
        public_key:
          anyOf:
            - type: string
            - type: "null"
          description: Null generates a keypair; a value imports public material.
    CreatedKeyPair:
      type: object
      additionalProperties: false
      required: [keypair, private_key]
      properties:
        keypair:
          $ref: "#/components/schemas/KeyPair"
        private_key:
          anyOf:
            - type: string
            - type: "null"
          description: One-time generated private material; never persisted by Vantage.
    Network:
      type: object
      additionalProperties: false
      required: [id, name, status, shared, external]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        shared:
          type: boolean
        external:
          type: boolean
        mtu:
          type: integer
        subnet_count:
          type: integer
          minimum: 0
    NetworkPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Network"
        page:
          $ref: "#/components/schemas/PageInfo"
    SecurityGroup:
      type: object
      additionalProperties: false
      required: [id, name, rule_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        rule_count:
          type: integer
          minimum: 0
        revision_number:
          type: integer
          minimum: 0
    SecurityGroupPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityGroup"
        page:
          $ref: "#/components/schemas/PageInfo"
    FixedIP:
      type: object
      additionalProperties: false
      required: [ip_address]
      properties:
        subnet_id:
          type: string
          format: uuid
        ip_address:
          type: string
    Port:
      type: object
      additionalProperties: false
      required: [id, network_id, status, mac_address, fixed_ips]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        network_id:
          type: string
          format: uuid
        status:
          type: string
        mac_address:
          type: string
        fixed_ips:
          type: array
          items:
            $ref: "#/components/schemas/FixedIP"
        security_group_ids:
          type: array
          items:
            type: string
            format: uuid
        qos_policy_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        device_owner:
          type: string
        device_id:
          type: string
        revision_number:
          type: integer
          minimum: 0
    InterfacePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Port"
    FloatingIP:
      type: object
      additionalProperties: false
      required: [id, floating_ip_address, floating_network_id, status]
      properties:
        id:
          type: string
          format: uuid
        floating_ip_address:
          type: string
        floating_network_id:
          type: string
          format: uuid
        port_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        fixed_ip_address:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
        description:
          type: string
        revision_number:
          type: integer
          minimum: 0
    FloatingIPPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FloatingIP"
        page:
          $ref: "#/components/schemas/PageInfo"
    Volume:
      type: object
      additionalProperties: false
      required: [id, name, status, size_gib]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        size_gib:
          type: integer
          minimum: 0
        volume_type:
          type: string
        bootable:
          type: boolean
        multiattach:
          type: boolean
        attachment_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    VolumePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Volume"
        page:
          $ref: "#/components/schemas/PageInfo"
    VolumeAttachment:
      type: object
      additionalProperties: false
      required: [id, volume_id, instance_id, status]
      properties:
        id:
          type: string
          format: uuid
        volume_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [attaching, attached, detaching, error]
        device:
          type: string
        attached_at:
          type: string
          format: date-time
    VolumeAttachmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VolumeAttachment"
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
        openstack_request_id:
          type: string
