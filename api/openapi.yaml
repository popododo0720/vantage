openapi: 3.1.0
info:
  title: Vantage BFF API
  version: 0.4.0
  summary: Implemented session, scope, compute inventory, and complete Cinder storage API
  description: 'Browser-facing API implemented by the current Vantage runtime. The browser

    never receives an OpenStack token or calls an OpenStack service endpoint

    directly. Operations not yet promoted to this runtime contract remain in

    the staged `openapi.goal1-mvp.yaml` contract.

    '
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Session
  description: Browser session lifecycle backed by Keystone authentication.
- name: Projects
  description: Accessible projects and the active project scope.
- name: Overview
  description: Quota-first project overview with isolated service failures.
- name: Quotas
  description: Detailed compute, network, and storage quota usage.
- name: Instances
  description: Bounded, project-scoped Nova inventory and instance details.
- name: Provisioning Inputs
  description: Bounded, project-scoped inventories used to provision instances.
- name: storage
  description: Backend-neutral project and policy-gated administrator Cinder operations.
paths:
  /session:
    get:
      tags:
      - Session
      summary: Get the current Vantage session
      operationId: getSession
      responses:
        '200':
          description: Authenticated session
          headers:
            X-CSRF-Token:
              $ref: '#/components/headers/CsrfToken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - Session
      summary: Update browser-facing session preferences
      operationId: updateSessionPreferences
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPreferenceRequest'
      responses:
        '200':
          description: Updated session preferences
          headers:
            X-CSRF-Token:
              $ref: '#/components/headers/CsrfToken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidRequest'
    delete:
      tags:
      - Session
      summary: Sign out and invalidate the server session
      description: 'Idempotent when the session is absent or expired. A live session

        requires its session-bound CSRF token.

        '
      operationId: deleteSession
      security:
      - sessionCookie: []
      - {}
      parameters:
      - $ref: '#/components/parameters/OptionalCsrfToken'
      responses:
        '204':
          description: Session deleted or already absent
        '403':
          $ref: '#/components/responses/Forbidden'
  /session/login:
    post:
      tags:
      - Session
      summary: Authenticate with Keystone through Vantage
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque HttpOnly, Secure, SameSite session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: '#/components/headers/CsrfToken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /projects:
    get:
      tags:
      - Projects
      summary: List projects accessible to the signed-in user
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      - name: name
        in: query
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: Server-filtered project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /scope:
    put:
      tags:
      - Projects
      summary: Set the active project and region
      operationId: setScope
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeRequest'
      responses:
        '200':
          description: Rotated project-scoped session context
          headers:
            Set-Cookie:
              description: Rotated opaque session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: '#/components/headers/CsrfToken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /overview:
    get:
      tags:
      - Overview
      summary: Get the active project's quota-first overview
      operationId: getProjectOverview
      responses:
        '200':
          description: Overview with independent service results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /quotas:
    get:
      tags:
      - Quotas
      summary: Get detailed quotas for the active project
      operationId: getProjectQuotas
      parameters:
      - name: service
        in: query
        description: Return one service group; omit for every quota source.
        schema:
          type: string
          enum:
          - compute
          - network
          - storage
      responses:
        '200':
          description: Detailed quotas with independent service failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaCollection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /instances:
    get:
      tags:
      - Instances
      summary: List instances in the active project
      description: 'Uses a server-side Nova marker chain. Vantage fetches at most one

        requested page plus one look-ahead item and never enumerates the full

        project collection to synthesize a total.

        '
      operationId: listInstances
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      - name: name
        in: query
        schema:
          type: string
          maxLength: 255
      - name: status
        in: query
        schema:
          type: string
          maxLength: 64
      - name: image_id
        in: query
        schema:
          type: string
          maxLength: 255
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - name
          - status
          default: created_at
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: A bounded cursor-backed instance page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /images:
    get:
      tags:
      - Provisioning Inputs
      summary: List images available to the active project
      operationId: listImages
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      - name: name
        in: query
        schema:
          type: string
          maxLength: 255
      - name: visibility
        in: query
        schema:
          type: string
          enum:
          - private
          - shared
          - community
          - public
      responses:
        '200':
          description: A bounded cursor-backed image page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /flavors:
    get:
      tags:
      - Provisioning Inputs
      summary: List flavors available to the active project
      operationId: listFlavors
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: A bounded cursor-backed flavor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlavorPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /keypairs:
    get:
      tags:
      - Provisioning Inputs
