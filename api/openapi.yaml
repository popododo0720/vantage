openapi: 3.1.0
info:
  title: Vantage BFF API
  version: 0.3.0
  summary: Implemented session, scope, inventory, and compute lifecycle API
  description: |
    Browser-facing API implemented by the current Vantage runtime. The browser
    never receives an OpenStack token or calls an OpenStack service endpoint
    directly. Operations not yet promoted to this runtime contract remain in
    the staged `openapi.goal1-mvp.yaml` contract.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Session
    description: Browser session lifecycle backed by Keystone authentication.
  - name: Projects
    description: Accessible projects and the active project scope.
  - name: Overview
    description: Quota-first project overview with isolated service failures.
  - name: Quotas
    description: Detailed compute, network, and storage quota usage.
  - name: Instances
    description: Bounded, project-scoped Nova inventory and instance details.
  - name: Provisioning Inputs
    description: Bounded, project-scoped inventories used to provision instances.
paths:
  /session:
    get:
      tags: [Session]
      summary: Get the current Vantage session
      operationId: getSession
      responses:
        "200":
          description: Authenticated session
          headers:
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      tags: [Session]
      summary: Update browser-facing session preferences
      operationId: updateSessionPreferences
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPreferenceRequest"
      responses:
        "200":
          description: Updated session preferences
          headers:
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"
    delete:
      tags: [Session]
      summary: Sign out and invalidate the server session
      description: |
        Idempotent when the session is absent or expired. A live session
        requires its session-bound CSRF token.
      operationId: deleteSession
      security:
        - sessionCookie: []
        - {}
      parameters:
        - $ref: "#/components/parameters/OptionalCsrfToken"
      responses:
        "204":
          description: Session deleted or already absent
        "403":
          $ref: "#/components/responses/Forbidden"
  /session/login:
    post:
      tags: [Session]
      summary: Authenticate with Keystone through Vantage
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Session created
          headers:
            Set-Cookie:
              description: Opaque HttpOnly, Secure, SameSite session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /projects:
    get:
      tags: [Projects]
      summary: List projects accessible to the signed-in user
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Server-filtered project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /scope:
    put:
      tags: [Projects]
      summary: Set the active project and region
      operationId: setScope
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeRequest"
      responses:
        "200":
          description: Rotated project-scoped session context
          headers:
            Set-Cookie:
              description: Rotated opaque session cookie.
              schema:
                type: string
            X-CSRF-Token:
              $ref: "#/components/headers/CsrfToken"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /overview:
    get:
      tags: [Overview]
      summary: Get the active project's quota-first overview
      operationId: getProjectOverview
      responses:
        "200":
          description: Overview with independent service results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /quotas:
    get:
      tags: [Quotas]
      summary: Get detailed quotas for the active project
      operationId: getProjectQuotas
      parameters:
        - name: service
          in: query
          description: Return one service group; omit for every quota source.
          schema:
            type: string
            enum: [compute, network, storage]
      responses:
        "200":
          description: Detailed quotas with independent service failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /instances:
    get:
      tags: [Instances]
      summary: List instances in the active project
      description: |
        Uses a server-side Nova marker chain. Vantage fetches at most one
        requested page plus one look-ahead item and never enumerates the full
        project collection to synthesize a total.
      operationId: listInstances
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          schema:
            type: string
            maxLength: 64
        - name: image_id
          in: query
          schema:
            type: string
            maxLength: 255
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, name, status]
            default: created_at
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: A bounded cursor-backed instance page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "422":
          $ref: "#/components/responses/InvalidRequest"
    post:
      tags: [Instances]
      summary: Create one or more project instances
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateInstanceRequest"}
      responses:
        "202": {$ref: "#/components/responses/AcceptedOperation"}
  /images:
    get:
      tags: [Provisioning Inputs]
      summary: List images available to the active project
      operationId: listImages
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema: {type: string, maxLength: 255}
        - name: visibility
          in: query
          schema: {type: string, enum: [private, shared, community, public]}
      responses:
        "200":
          description: A bounded cursor-backed image page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImagePage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
    post:
      tags: [Provisioning Inputs]
      summary: Create or web-import an image subject to Glance policy
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ImageCreateRequest"}}}
      responses:
        "202": {$ref: "#/components/responses/AcceptedOperation"}
  /flavors:
    get:
      tags: [Provisioning Inputs]
      summary: List flavors available to the active project
      operationId: listFlavors
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "200":
          description: A bounded cursor-backed flavor page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FlavorPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
    post:
      tags: [Provisioning Inputs]
      summary: Create an administrator-policy-gated Flavor
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FlavorCreateRequest"}}}
      responses:
        "202": {$ref: "#/components/responses/AcceptedOperation"}
  /keypairs:
    get:
      tags: [Provisioning Inputs]
      summary: List keypairs in the active project
      operationId: listKeyPairs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
      responses:
        "200":
          description: A bounded cursor-backed keypair page without private material.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyPairPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /networks:
    get:
      tags: [Provisioning Inputs]
      summary: List project-visible networks
      operationId: listNetworks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema: {type: string, maxLength: 255}
        - name: status
          in: query
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: A bounded cursor-backed network page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /security-groups:
    get:
      tags: [Provisioning Inputs]
      summary: List project-visible security groups
      operationId: listSecurityGroups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageNumber"
        - name: name
          in: query
          schema: {type: string, maxLength: 255}
      responses:
        "200":
          description: A bounded cursor-backed security-group page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecurityGroupPage"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /instances/{instance_id}:
    get:
      tags: [Instances]
      summary: Get one instance in the active project
      operationId: getInstance
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: Project-scoped instance detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "422":
          $ref: "#/components/responses/InvalidRequest"
    patch:
      tags: [Instances]
      summary: Edit Nova-mutable instance fields
      parameters:
        - {$ref: "#/components/parameters/InstanceId"}
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpdateInstanceRequest"}}}
      responses:
        "202": {$ref: "#/components/responses/AcceptedOperation"}
    delete:
      tags: [Instances]
      summary: Delete an instance after dependency confirmation
      parameters:
        - {$ref: "#/components/parameters/InstanceId"}
        - {$ref: "#/components/parameters/CsrfToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202": {$ref: "#/components/responses/AcceptedOperation"}
  /operations/{operation_id}:
    get:
      tags: [Instances]
      summary: Get an isolated operation
      parameters: [{name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: Operation, content: {application/json: {schema: {$ref: "#/components/schemas/Operation"}}}}}
  /instances/{instance_id}/delete-preview:
    get:
      tags: [Instances]
      summary: Preview retained dependencies
      parameters: [{$ref: "#/components/parameters/InstanceId"}]
      responses: {"200": {description: Preview, content: {application/json: {schema: {$ref: "#/components/schemas/DeletePreview"}}}}}
  /instances/{instance_id}/actions:
    post:
      tags: [Instances]
      summary: Run a lifecycle action
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InstanceActionRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/resize:
    post:
      tags: [Instances]
      summary: Resize an instance
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ResizeRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/resize/confirm:
    post:
      tags: [Instances]
      summary: Confirm resize
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/resize/revert:
    post:
      tags: [Instances]
      summary: Revert resize
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/rebuild:
    post:
      tags: [Instances]
      summary: Rebuild an instance
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RebuildRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/snapshot:
    post:
      tags: [Instances]
      summary: Snapshot an instance
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SnapshotRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /instances/{instance_id}/console:
    post:
      tags: [Instances]
      summary: Create a short-lived noVNC session
      parameters: [{$ref: "#/components/parameters/InstanceId"}, {$ref: "#/components/parameters/CsrfToken"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConsoleRequest"}}}}
      responses: {"201": {description: Ephemeral URL, content: {application/json: {schema: {$ref: "#/components/schemas/ConsoleSession"}}}}}
  /images/{image_id}:
    parameters: [{name: image_id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [Provisioning Inputs]
      summary: Update an image
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImageUpdateRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
    delete:
      tags: [Provisioning Inputs]
      summary: Delete an image
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /images/{image_id}/actions:
    post:
      tags: [Provisioning Inputs]
      summary: Activate or deactivate an image
      parameters: [{name: image_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /images/{image_id}/members:
    post:
      tags: [Provisioning Inputs]
      summary: Add image project access
      parameters: [{name: image_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectAccessRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /images/{image_id}/members/{project_id}:
    delete:
      tags: [Provisioning Inputs]
      summary: Remove image project access
      parameters: [{name: image_id, in: path, required: true, schema: {type: string, format: uuid}}, {name: project_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /flavors/{flavor_id}:
    parameters: [{name: flavor_id, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Provisioning Inputs]
      summary: Update a Flavor description
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
    delete:
      tags: [Provisioning Inputs]
      summary: Delete a Flavor
      parameters: [{$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /flavors/{flavor_id}/extra-specs:
    put:
      tags: [Provisioning Inputs]
      summary: Set Flavor extra specs
      parameters: [{name: flavor_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /flavors/{flavor_id}/extra-specs/{spec_key}:
    delete:
      tags: [Provisioning Inputs]
      summary: Unset a Flavor extra spec
      parameters: [{name: flavor_id, in: path, required: true, schema: {type: string}}, {name: spec_key, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /flavors/{flavor_id}/access:
    post:
      tags: [Provisioning Inputs]
      summary: Add private Flavor access
      parameters: [{name: flavor_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectAccessRequest"}}}}
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
  /flavors/{flavor_id}/access/{project_id}:
    delete:
      tags: [Provisioning Inputs]
      summary: Remove private Flavor access
      parameters: [{name: flavor_id, in: path, required: true, schema: {type: string}}, {name: project_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/CsrfToken"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"202": {$ref: "#/components/responses/AcceptedOperation"}}
components:
  headers:
    CsrfToken:
      description: Session-bound CSRF token retained only in browser memory.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vantage_session
      description: Opaque session identifier; never an OpenStack token.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Bound to the current Vantage server session.
      schema:
        type: string
    OptionalCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when a live Vantage session exists.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Discrete server-side page size selected by the user.
      schema:
        type: integer
        enum: [10, 25, 50, 100]
        default: 25
    PageNumber:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  responses:
    AcceptedOperation:
      description: Idempotent operation accepted
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Operation"}
    Unauthenticated:
      description: The Vantage session is missing or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The request failed CSRF or OpenStack policy enforcement.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource is unavailable in the active scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The active scope or requested progressive cursor page is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many requests at the Vantage or identity boundary.
      headers:
        Retry-After:
          description: Seconds before retry when provided by the boundary.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: An OpenStack service is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: An OpenStack service did not respond within the bounded deadline.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: Request schema or query validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, submitted_at, updated_at, target, trace_id, openstack_request_ids]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string, enum: [accepted, running, succeeded, failed, cancelled]}
        submitted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        target:
          type: object
          required: [resource_type]
          properties:
            resource_type: {type: string}
            resource_id: {anyOf: [{type: string}, {type: "null"}]}
            resource_name: {anyOf: [{type: string}, {type: "null"}]}
        trace_id: {type: string}
        openstack_request_ids: {type: array, items: {type: string}}
        problem: {anyOf: [{$ref: "#/components/schemas/Problem"}, {type: "null"}]}
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      required: [name, boot_source, flavor_id, networks]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 255}
        hostname: {type: string, maxLength: 255}
        count: {type: integer, minimum: 1, maximum: 100, default: 1}
        flavor_id: {type: string}
        boot_source:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [image, volume, volume_snapshot]}
            image_id: {type: string, format: uuid}
            volume_id: {type: string, format: uuid}
            snapshot_id: {type: string, format: uuid}
            create_boot_volume: {type: boolean}
            volume_size_gib: {type: integer, minimum: 1}
            volume_type: {type: string}
            delete_on_termination: {type: boolean}
        networks:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              network_id: {type: string, format: uuid}
              subnet_id: {type: string, format: uuid}
              port_id: {type: string, format: uuid}
              fixed_ip: {type: string}
              tag: {type: string}
        security_group_ids: {type: array, items: {type: string, format: uuid}}
        keypair_name: {type: string}
        availability_zone: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        config_drive: {type: boolean}
        user_data: {type: string, writeOnly: true, maxLength: 65535}
        block_devices: {type: array, items: {type: object}}
    UpdateInstanceRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {anyOf: [{type: string}, {type: "null"}]}
        metadata: {type: object, additionalProperties: {type: string}}
        unset_metadata: {type: array, items: {type: string}}
    InstanceActionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [start, stop, soft_reboot, hard_reboot, pause, unpause, suspend, resume, shelve, unshelve, rescue, unrescue, lock, unlock]}
        image_id: {type: string, format: uuid}
        locked_reason: {type: string, maxLength: 255}
    ResizeRequest:
      type: object
      required: [flavor_id]
      properties: {flavor_id: {type: string}}
    RebuildRequest:
      type: object
      required: [image_id]
      properties:
        image_id: {type: string, format: uuid}
        name: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        preserve_ephemeral: {type: boolean}
        user_data: {type: string, writeOnly: true}
    SnapshotRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
    ConsoleRequest:
      type: object
      properties:
        protocol: {type: string, const: vnc, default: vnc}
        type: {type: string, const: novnc, default: novnc}
    ConsoleSession:
      type: object
      required: [instance_id, type, url, expires_at]
      properties:
        instance_id: {type: string, format: uuid}
        type: {type: string, const: novnc}
        url: {type: string, format: uri, description: Sensitive and never persisted or logged}
        expires_at: {type: string, format: date-time}
        openstack_request_id: {anyOf: [{type: string}, {type: "null"}]}
    DeletePreview:
      type: object
      required: [instance_id, attached_volume_ids, network_contract, floating_ip_contract, warning]
      properties:
        instance_id: {type: string, format: uuid}
        attached_volume_ids: {type: array, items: {type: string}}
        network_contract: {type: string}
        floating_ip_contract: {type: string}
        warning: {type: string}
    ImageCreateRequest:
      type: object
      required: [name, disk_format]
      properties:
        name: {type: string}
        disk_format: {type: string}
        container_format: {type: string, default: bare}
        visibility: {type: string, enum: [private, shared, community, public]}
        min_disk_gib: {type: integer, minimum: 0}
        min_ram_mib: {type: integer, minimum: 0}
        protected: {type: boolean}
        properties: {type: object, additionalProperties: {type: string}}
        tags: {type: array, items: {type: string}}
        import_uri: {type: string, format: uri}
    ImageUpdateRequest:
      type: object
      properties:
        name: {type: string}
        visibility: {type: string, enum: [private, shared, community, public]}
        min_disk_gib: {type: integer, minimum: 0}
        min_ram_mib: {type: integer, minimum: 0}
        protected: {type: boolean}
        properties: {type: object, additionalProperties: {type: string}}
        unset_properties: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
    FlavorCreateRequest:
      type: object
      required: [name, vcpus, ram_mib]
      properties:
        name: {type: string}
        id: {type: string}
        vcpus: {type: integer, minimum: 1}
        ram_mib: {type: integer, minimum: 1}
        disk_gib: {type: integer, minimum: 0}
        ephemeral_gib: {type: integer, minimum: 0}
        swap_mib: {type: integer, minimum: 0}
        rxtx_factor: {type: number, exclusiveMinimum: 0}
        is_public: {type: boolean}
        description: {type: string}
        extra_specs: {type: object, additionalProperties: {type: string}}
        access_project_ids: {type: array, items: {type: string}}
    ProjectAccessRequest:
      type: object
      required: [project_id]
      properties: {project_id: {type: string}}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, domain]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          writeOnly: true
        domain:
          type: string
          minLength: 1
          maxLength: 255
    SessionPreferenceRequest:
      type: object
      additionalProperties: false
      required: [locale]
      properties:
        locale:
          type: string
          enum: [en, ko]
    Session:
      type: object
      additionalProperties: false
      required: [user, active_scope, expires_at, regions, locale]
      properties:
        user:
          $ref: "#/components/schemas/User"
        active_scope:
          anyOf:
            - $ref: "#/components/schemas/Scope"
            - type: "null"
        expires_at:
          type: string
          format: date-time
        regions:
          type: array
          items:
            type: string
        locale:
          type: string
          enum: [en, ko]
    User:
      type: object
      additionalProperties: false
      required: [id, name, domain_id]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
            - type: string
            - type: "null"
    Project:
      type: object
      additionalProperties: false
      required: [id, name, domain_id, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        domain_id:
          anyOf:
            - type: string
            - type: "null"
        enabled:
          anyOf:
            - type: boolean
            - type: "null"
    ScopeRequest:
      type: object
      additionalProperties: false
      required: [project_id, region]
      properties:
        project_id:
          type: string
        region:
          type: string
    Scope:
      type: object
      additionalProperties: false
      required: [project, region]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        region:
          type: string
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - number
        - size
        - item_from
        - item_to
        - total_items
        - total_pages
        - has_previous
        - has_next
        - navigable_pages
        - openstack_request_id
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
          enum: [10, 25, 50, 100]
        item_from:
          type: integer
          minimum: 0
        item_to:
          type: integer
          minimum: 0
        total_items:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        total_pages:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        has_previous:
          type: boolean
        has_next:
          type: boolean
        navigable_pages:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
        openstack_request_id:
          anyOf:
            - type: string
            - type: "null"
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          $ref: "#/components/schemas/PageInfo"
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, flavor, image, addresses]
      properties:
        id:
          type: string
          format: uuid
        name:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        flavor:
          anyOf:
            - type: string
            - type: "null"
        image:
          anyOf:
            - type: string
            - type: "null"
        addresses:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
    InstancePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        page:
          $ref: "#/components/schemas/PageInfo"
    Image:
      type: object
      additionalProperties: false
      required: [id, name, status, visibility, disk_format, container_format, size_bytes, min_disk_gib, min_ram_mib, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {anyOf: [{type: string}, {type: "null"}]}
        status: {anyOf: [{type: string}, {type: "null"}]}
        visibility:
          anyOf:
            - {type: string, enum: [private, shared, community, public]}
            - {type: "null"}
        disk_format: {anyOf: [{type: string}, {type: "null"}]}
        container_format: {anyOf: [{type: string}, {type: "null"}]}
        size_bytes: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        min_disk_gib: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        min_ram_mib: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        created_at:
          anyOf:
            - {type: string, format: date-time}
            - {type: "null"}
    ImagePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Image"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    Flavor:
      type: object
      additionalProperties: false
      required: [id, name, vcpus, ram_mib, disk_gib, ephemeral_gib, is_public]
      properties:
        id: {type: string}
        name: {anyOf: [{type: string}, {type: "null"}]}
        vcpus: {anyOf: [{type: integer, minimum: 1}, {type: "null"}]}
        ram_mib: {anyOf: [{type: integer, minimum: 1}, {type: "null"}]}
        disk_gib: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        ephemeral_gib: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        is_public: {anyOf: [{type: boolean}, {type: "null"}]}
    FlavorPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Flavor"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    KeyPair:
      type: object
      additionalProperties: false
      required: [name, type, fingerprint, public_key_preview, created_at, last_used_at]
      properties:
        name: {type: string}
        type:
          anyOf:
            - {type: string, enum: [ssh, x509]}
            - {type: "null"}
        fingerprint: {anyOf: [{type: string}, {type: "null"}]}
        public_key_preview: {anyOf: [{type: string}, {type: "null"}]}
        created_at:
          anyOf:
            - {type: string, format: date-time}
            - {type: "null"}
        last_used_at:
          anyOf:
            - {type: string, format: date-time}
            - {type: "null"}
    KeyPairPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/KeyPair"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    Network:
      type: object
      additionalProperties: false
      required: [id, name, status, shared, external, mtu, subnet_count]
      properties:
        id: {type: string, format: uuid}
        name: {anyOf: [{type: string}, {type: "null"}]}
        status: {anyOf: [{type: string}, {type: "null"}]}
        shared: {anyOf: [{type: boolean}, {type: "null"}]}
        external: {anyOf: [{type: boolean}, {type: "null"}]}
        mtu: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        subnet_count: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
    NetworkPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Network"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    SecurityGroup:
      type: object
      additionalProperties: false
      required: [id, name, description, rule_count, revision_number]
      properties:
        id: {type: string, format: uuid}
        name: {anyOf: [{type: string}, {type: "null"}]}
        description: {anyOf: [{type: string}, {type: "null"}]}
        rule_count: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
        revision_number: {anyOf: [{type: integer, minimum: 0}, {type: "null"}]}
    SecurityGroupPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SecurityGroup"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    InstanceVolumeAttachment:
      type: object
      additionalProperties: false
      required: [id, device]
      properties:
        id:
          type: string
        device:
          anyOf:
            - type: string
            - type: "null"
    InstanceDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - created_at
        - flavor
        - image
        - addresses
        - volumes
        - openstack_request_id
      properties:
        id:
          type: string
          format: uuid
        name:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: string
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        flavor:
          anyOf:
            - type: string
            - type: "null"
        image:
          anyOf:
            - type: string
            - type: "null"
        addresses:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        volumes:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/InstanceVolumeAttachment"
            - type: "null"
        openstack_request_id:
          anyOf:
            - type: string
            - type: "null"
    Quota:
      type: object
      additionalProperties: false
      required: [service, resource, used, reserved, limit, unit, state]
      properties:
        service:
          type: string
          enum: [compute, network, storage]
        resource:
          type: string
          enum:
            - instances
            - cores
            - ram_mib
            - volumes
            - gigabytes
            - snapshots
            - backups
            - backup_gigabytes
            - floating_ips
        used:
          type: number
          minimum: 0
        reserved:
          type: number
          minimum: 0
        limit:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
        unit:
          type: string
          enum: [count, MiB, GiB]
        state:
          type: string
          enum: [normal, watch, high, unknown]
    QuotaCollection:
      type: object
      additionalProperties: false
      required: [scope, generated_at, stale, quotas, partial_errors]
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        generated_at:
          type: string
          format: date-time
        stale:
          type: boolean
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/Quota"
        partial_errors:
          type: array
          items:
            $ref: "#/components/schemas/WidgetError"
    WidgetError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        openstack_request_id:
          type: string
    ProjectOverview:
      type: object
      additionalProperties: false
      required:
        - scope
        - generated_at
        - stale
        - quotas
        - instance_summary
        - partial_errors
      properties:
        scope:
          $ref: "#/components/schemas/Scope"
        generated_at:
          type: string
          format: date-time
        stale:
          type: boolean
        quotas:
          type: array
          items:
            $ref: "#/components/schemas/Quota"
        instance_summary:
          anyOf:
            - $ref: "#/components/schemas/InstanceSummary"
            - type: "null"
        partial_errors:
          type: array
          items:
            $ref: "#/components/schemas/WidgetError"
    InstanceSummary:
      type: object
      additionalProperties: false
      required: [total, active, stopped, error]
      properties:
        total:
          type: integer
          minimum: 0
        active:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        stopped:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        error:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        trace_id:
          type: string
        openstack_request_id:
          type: string
