          default: vnc
        type:
          type: string
          const: novnc
          default: novnc
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [instance_id, type, url, expires_at]
      properties:
        instance_id:
          type: string
          format: uuid
        type:
          type: string
          const: novnc
        url:
          type: string
