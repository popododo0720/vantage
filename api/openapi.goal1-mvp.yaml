          format: uuid
        ip_address:
          type: string
    AttachInterfaceRequest:
      type: object
      additionalProperties: false
      description: Exactly one of network_id or port_id is required.
      oneOf:
        - required: [network_id]
          not:
            required: [port_id]
        - required: [port_id]
          not:
            anyOf:
              - required: [network_id]
              - required: [fixed_ips]
      properties:
        network_id:
          type: string
          format: uuid
        port_id:
          type: string
          format: uuid
        fixed_ips:
          type: array
          items:
            $ref: "#/components/schemas/FixedIPRequest"
    UpdatePortRequest:
      type: object
