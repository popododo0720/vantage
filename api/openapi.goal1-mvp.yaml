          anyOf:
            - type: string
            - type: "null"
        resource_name:
          anyOf:
            - type: string
            - type: "null"
    Operation:
      type: object
      additionalProperties: false
      required: [id, kind, status, submitted_at, target]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed, cancelled]
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        target:
